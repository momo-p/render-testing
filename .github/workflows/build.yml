name: build

on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          docker build -t "ghcr.io/${GITHUB_REPOSITORY,,}:latest" .
      - name: Smoke test
        run: |
          docker run --rm "$IMAGE:latest" sh -c '
            blender -b --version &&
            ffmpeg -version | head -1 &&
            python -c "import torch; from diffusers import Flux2KleinPipeline; print(\"torch\", torch.__version__)" &&
            /opt/tts/bin/python -c "import kokoro, soundfile; print(\"kokoro ok\")"'
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:latest" "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
